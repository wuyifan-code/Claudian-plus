<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="100%" role="img" aria-labelledby="cpHeroZhTitle cpHeroZhDesc">
  <title id="cpHeroZhTitle">Claudian Plus — 本地优先的 Obsidian AI 工作空间</title>
  <desc id="cpHeroZhDesc">标题区：Claudian Plus，配一句「你的笔记记得，你的 AI 也该记得。」右侧是笔记库拓扑图，若干笔记节点汇入中央的 memory.md 节点，并标注默认 1,500 字符的注入预算。</desc>
  <defs>
    <style>
      .serif { font-family: "Songti SC", "Source Han Serif SC", "Charter", "Georgia", "Cambria", serif; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans", sans-serif; }
      .mono { font-family: ui-monospace, "SF Mono", "Cascadia Code", "Fira Code", monospace; }
    </style>
  </defs>

  <!-- Canvas: warm parchment with hairline border -->
  <rect x="0" y="0" width="1200" height="440" rx="16" fill="#FAF8F5" stroke="#E6DFD5" stroke-width="1.5" />
  <line x1="672" y1="44" x2="672" y2="396" stroke="#EFE9DE" stroke-width="1" />

  <!-- ===================== LEFT: IDENTITY ===================== -->
  <g id="identity">
    <circle cx="69" cy="78" r="5" fill="#C85023" />
    <text x="90" y="84" class="sans" font-size="18" font-weight="600" fill="#7A746B" letter-spacing="0.6">OBSIDIAN · 本地优先的 AI 工作空间</text>

    <text x="64" y="164" class="sans" font-size="58" font-weight="700" fill="#1C1B19" letter-spacing="-1">Claudian Plus</text>

    <text x="64" y="226" class="serif" font-size="27" fill="#1C1B19">你的笔记记得，</text>
    <text x="64" y="262" class="serif" font-size="27" fill="#1C1B19">你的 AI 也该记得。</text>

    <text x="64" y="312" class="sans" font-size="19" fill="#736D64">六个编码 Agent，一个笔记库，一份你自己拥有的记忆文件。</text>

    <!-- Attribute tags -->
    <g id="tags">
      <rect x="64" y="340" width="196" height="38" rx="7" fill="#F4EFE6" stroke="#DED6C8" stroke-width="1" />
      <text x="82" y="365" class="mono" font-size="18" font-weight="600" fill="#9C3A16">0 KB TELEMETRY</text>

      <rect x="272" y="340" width="176" height="38" rx="7" fill="#F4EFE6" stroke="#DED6C8" stroke-width="1" />
      <text x="290" y="365" class="sans" font-size="18" font-weight="600" fill="#1C1B19">仅支持桌面端</text>

      <rect x="460" y="340" width="186" height="38" rx="7" fill="#F4EFE6" stroke="#DED6C8" stroke-width="1" />
      <text x="478" y="365" class="mono" font-size="18" font-weight="600" fill="#1C1B19">MIT | AGPL-3.0</text>
    </g>
  </g>

  <!-- ===================== RIGHT: VAULT TOPOLOGY ===================== -->
  <g id="vault-topology" transform="translate(712, 44)">
    <rect x="0" y="0" width="424" height="340" rx="12" fill="#F4EFE6" stroke="#E2DBD0" stroke-width="1" />
    <text x="22" y="34" class="sans" font-size="18" font-weight="600" fill="#8C857B" letter-spacing="0.6">笔记库拓扑</text>

    <!-- Existing link structure -->
    <g stroke="#CDC5B7" stroke-width="1.2">
      <line x1="62" y1="108" x2="162" y2="86" />
      <line x1="162" y1="86" x2="256" y2="116" />
      <line x1="256" y1="116" x2="352" y2="94" />
      <line x1="62" y1="108" x2="94" y2="214" />
      <line x1="94" y1="214" x2="206" y2="232" />
      <line x1="206" y1="232" x2="344" y2="208" />
      <line x1="256" y1="116" x2="206" y2="232" />
      <line x1="352" y1="94" x2="344" y2="208" />
    </g>

    <!-- Memory edges: solid = distilled, dashed = injected back -->
    <g stroke="#C85023" stroke-width="1.8">
      <line x1="184" y1="162" x2="256" y2="116" />
      <line x1="184" y1="162" x2="94" y2="214" />
    </g>
    <g stroke="#C85023" stroke-width="1.6" stroke-dasharray="4 4">
      <line x1="184" y1="162" x2="62" y2="108" />
      <line x1="184" y1="162" x2="206" y2="232" />
    </g>

    <!-- Note nodes -->
    <g fill="#A8A298">
      <circle cx="62" cy="108" r="6" />
      <circle cx="162" cy="86" r="6" />
      <circle cx="256" cy="116" r="5" />
      <circle cx="352" cy="94" r="6" />
      <circle cx="94" cy="214" r="6" />
      <circle cx="206" cy="232" r="6" />
      <circle cx="344" cy="208" r="5" />
    </g>

    <!-- The memory node -->
    <circle cx="184" cy="162" r="16" fill="#FAF8F5" stroke="#C85023" stroke-width="2.2" />
    <circle cx="184" cy="162" r="6.5" fill="#C85023" />
    <text x="210" y="168" class="mono" font-size="18" font-weight="600" fill="#C85023">memory.md</text>

    <line x1="22" y1="262" x2="402" y2="262" stroke="#E2DBD0" stroke-width="1" />

    <!-- Legend -->
    <circle cx="28" cy="284" r="5" fill="#A8A298" />
    <text x="44" y="290" class="sans" font-size="18" fill="#8C857B">笔记</text>
    <circle cx="112" cy="284" r="5" fill="#C85023" />
    <text x="128" y="290" class="sans" font-size="18" font-weight="600" fill="#C85023">记忆</text>

    <!-- Real, source-backed default -->
    <text x="22" y="326" class="sans" font-size="18" fill="#8C857B">注入预算</text>
    <text x="402" y="326" class="mono" font-size="18" font-weight="600" fill="#9C3A16" text-anchor="end">1,500 chars</text>
  </g>
</svg>
