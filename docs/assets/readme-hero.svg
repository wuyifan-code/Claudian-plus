<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="100%" height="100%">
  <title>Claudian Plus - Local-First Cognitive Agent Workspace for Obsidian</title>
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181716" />
      <stop offset="50%" stop-color="#141312" />
      <stop offset="100%" stop-color="#0E0D0C" />
    </linearGradient>

    <linearGradient id="terracottaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A3D" />
      <stop offset="100%" stop-color="#D9531E" />
    </linearGradient>

    <linearGradient id="slateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A1B5C4" />
      <stop offset="100%" stop-color="#5E7382" />
    </linearGradient>

    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E05D26" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#E05D26" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#232220" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1A1918" stop-opacity="0.6" />
    </linearGradient>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Noto Sans", sans-serif; font-weight: 700; }
    .serif-quote { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", serif; font-style: italic; }
    .mono { font-family: ui-monospace, "SF Mono", Monaco, "Cascadia Code", "Fira Code", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Noto Sans", sans-serif; }
  </style>

  <!-- Background Card -->
  <rect x="0" y="0" width="1200" height="460" rx="24" fill="url(#bgGrad)" stroke="#2D2B28" stroke-width="1.5" />

  <!-- Ambient Light Orbs -->
  <circle cx="980" cy="200" r="160" fill="#E05D26" opacity="0.08" filter="url(#softGlow)" />
  <circle cx="200" cy="380" r="140" fill="#A1B5C4" opacity="0.04" filter="url(#softGlow)" />

  <!-- Grid overlay in background -->
  <g opacity="0.06" stroke="#FAF8F5" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="460" stroke-dasharray="4 8" />
    <line x1="300" y1="0" x2="300" y2="460" stroke-dasharray="4 8" />
    <line x1="500" y1="0" x2="500" y2="460" stroke-dasharray="4 8" />
    <line x1="700" y1="0" x2="700" y2="460" stroke-dasharray="4 8" />
    <line x1="900" y1="0" x2="900" y2="460" stroke-dasharray="4 8" />
    <line x1="1100" y1="0" x2="1100" y2="460" stroke-dasharray="4 8" />
    <line x1="0" y1="120" x2="1200" y2="120" stroke-dasharray="4 8" />
    <line x1="0" y1="260" x2="1200" y2="260" stroke-dasharray="4 8" />
    <line x1="0" y1="380" x2="1200" y2="380" stroke-dasharray="4 8" />
  </g>

  <!-- ================= LEFT: IDENTITY & VALUE ================= -->

  <!-- Pill eyebrow: Category & Version -->
  <g transform="translate(64, 48)">
    <rect x="0" y="0" width="310" height="28" rx="14" fill="#22201E" stroke="#3A3733" stroke-width="1" />
    <circle cx="14" cy="14" r="4" fill="#E05D26" />
    <text x="26" y="18" class="mono" font-size="11" font-weight="600" fill="#C5BFB5" letter-spacing="1">OBSIDIAN / COGNITIVE WORKSPACE</text>
    <rect x="250" y="5" width="52" height="18" rx="9" fill="#2E2C28" />
    <text x="262" y="17" class="mono" font-size="10" font-weight="600" fill="#E05D26">v3.0.1</text>
  </g>

  <!-- Product Name with Asterisk Symbol -->
  <g transform="translate(64, 132)">
    <!-- Asterisk glyph (Claudian signature) -->
    <g transform="translate(0, -32) scale(0.9)">
      <circle cx="24" cy="24" r="22" fill="#262320" stroke="#E05D26" stroke-width="1.5" />
      <path d="M 24 10 L 24 38 M 10 24 L 38 24 M 14 14 L 34 34 M 14 34 L 34 14" stroke="#FF7A3D" stroke-width="3" stroke-linecap="round" />
    </g>
    <text x="56" y="0" class="title" font-size="44" fill="#FAF7F2" letter-spacing="-0.5">Claudian Plus</text>
  </g>

  <!-- Value Proposition -->
  <text x="64" y="184" class="sans" font-size="21" font-weight="600" fill="#E8E2D8">
    Your notes remember. Now your AI does too.
  </text>
  <text x="64" y="214" class="sans" font-size="15" font-weight="400" fill="#9C9589">
    在 Obsidian，让 AI 记住你。本地优先多 Agent 协同工作空间。
  </text>

  <!-- Key Capability Badges -->
  <g transform="translate(64, 256)">
    <!-- Dreaming V3 Pill -->
    <rect x="0" y="0" width="176" height="34" rx="8" fill="#24211E" stroke="#E05D26" stroke-width="1" />
    <text x="14" y="21" class="sans" font-size="13" font-weight="600" fill="#FF8F5A">🧠 Dreaming V3 闲时微梦</text>

    <!-- Multi-Agent Pill -->
    <rect x="186" y="0" width="168" height="34" rx="8" fill="#202224" stroke="#5E7382" stroke-width="1" />
    <text x="200" y="21" class="sans" font-size="13" font-weight="600" fill="#A1B5C4">⚡ Codex-first 多 Agent</text>

    <!-- Local Vault Pill -->
    <rect x="364" y="0" width="144" height="34" rx="8" fill="#22201E" stroke="#3A3733" stroke-width="1" />
    <text x="378" y="21" class="sans" font-size="13" font-weight="600" fill="#C5BFB5">🔒 本地优先 0 遥测</text>
  </g>

  <!-- Provider Support Row -->
  <g transform="translate(64, 324)">
    <text x="0" y="18" class="mono" font-size="11" fill="#787267" letter-spacing="1.5">SUPPORTED PROVIDERS:</text>
    
    <g transform="translate(0, 32)">
      <!-- Codex -->
      <rect x="0" y="0" width="88" height="28" rx="6" fill="#2E231D" stroke="#D9531E" stroke-width="1" />
      <text x="12" y="18" class="mono" font-size="12" font-weight="600" fill="#FFA573">Codex ✦</text>

      <!-- Claude -->
      <rect x="98" y="0" width="80" height="28" rx="6" fill="#1F1E1D" stroke="#383633" stroke-width="1" />
      <text x="110" y="18" class="mono" font-size="12" font-weight="500" fill="#D6D0C5">Claude</text>

      <!-- Kimi ACP -->
      <rect x="188" y="0" width="90" height="28" rx="6" fill="#1F1E1D" stroke="#383633" stroke-width="1" />
      <text x="198" y="18" class="mono" font-size="12" font-weight="500" fill="#D6D0C5">Kimi ACP</text>

      <!-- OpenCode -->
      <rect x="288" y="0" width="94" height="28" rx="6" fill="#1F1E1D" stroke="#383633" stroke-width="1" />
      <text x="298" y="18" class="mono" font-size="12" font-weight="500" fill="#D6D0C5">OpenCode</text>

      <!-- Pi -->
      <rect x="392" y="0" width="56" height="28" rx="6" fill="#1F1E1D" stroke="#383633" stroke-width="1" />
      <text x="408" y="18" class="mono" font-size="12" font-weight="500" fill="#D6D0C5">Pi</text>
    </g>
  </g>

  <!-- ================= RIGHT: VISUAL PROOF (KNOWLEDGE GRAPH & DREAMING) ================= -->

  <!-- Container Box for Visual -->
  <g transform="translate(680, 48)">
    <rect x="0" y="0" width="460" height="364" rx="18" fill="url(#cardBg)" stroke="#2F2D2A" stroke-width="1.2" />

    <!-- Card Header -->
    <g transform="translate(20, 24)">
      <circle cx="6" cy="6" r="4.5" fill="#E05D26" />
      <circle cx="22" cy="6" r="4.5" fill="#A1B5C4" />
      <circle cx="38" cy="6" r="4.5" fill="#3D3A36" />
      <text x="64" y="10" class="mono" font-size="11" font-weight="600" fill="#9C9589" letter-spacing="1">VAULT KNOWLEDGE GRAPH</text>
    </g>

    <!-- Constellation Lines & Graph Links -->
    <g stroke="#3A3733" stroke-width="1" opacity="0.65">
      <!-- Outer cluster connections -->
      <line x1="80" y1="120" x2="160" y2="90" />
      <line x1="160" y1="90" x2="250" y2="130" />
      <line x1="80" y1="120" x2="120" y2="180" />
      <line x1="120" y1="180" x2="220" y2="200" />
      <line x1="250" y1="130" x2="360" y2="100" />
      <line x1="360" y1="100" x2="410" y2="160" />
      <line x1="360" y1="100" x2="310" y2="200" />
      <line x1="220" y1="200" x2="310" y2="200" />
      <line x1="310" y1="200" x2="390" y2="240" />
      <line x1="120" y1="180" x2="160" y2="270" />
      <line x1="160" y1="270" x2="260" y2="280" />
      <line x1="260" y1="280" x2="310" y2="200" />
    </g>

    <!-- Active Terracotta Knowledge Beam -->
    <line x1="120" y1="180" x2="250" y2="160" stroke="#FF7A3D" stroke-width="3" stroke-linecap="round" filter="url(#subtleGlow)" />
    <line x1="250" y1="160" x2="340" y2="220" stroke="#FF7A3D" stroke-width="2" stroke-linecap="round" />

    <!-- Supporting Graph Nodes -->
    <circle cx="80" cy="120" r="4" fill="#5E7382" />
    <circle cx="160" cy="90" r="5" fill="#788B99" />
    <circle cx="360" cy="100" r="5" fill="#788B99" />
    <circle cx="410" cy="160" r="4" fill="#5E7382" />
    <circle cx="390" cy="240" r="4" fill="#5E7382" />
    <circle cx="160" cy="270" r="4" fill="#5E7382" />
    <circle cx="260" cy="280" r="5" fill="#788B99" />

    <!-- Central Knowledge Core: Project Decisions -->
    <g transform="translate(120, 180)">
      <circle cx="0" cy="0" r="16" fill="#D9531E" filter="url(#subtleGlow)" />
      <circle cx="0" cy="0" r="6" fill="#FAF8F5" />
      <text x="-48" y="-22" class="sans" font-size="12" font-weight="600" fill="#FFAD85">项目决策 / Notes</text>
    </g>

    <!-- Dreaming Engine Node -->
    <g transform="translate(250, 160)">
      <circle cx="0" cy="0" r="12" fill="#E05D26" />
      <circle cx="0" cy="0" r="4" fill="#FFFFFF" />
      <text x="18" y="-12" class="mono" font-size="11" font-weight="600" fill="#FFA573">Dreaming V3</text>
    </g>

    <!-- Distilled Memory Target: memory.md -->
    <g transform="translate(340, 220)">
      <rect x="-10" y="-14" width="105" height="28" rx="6" fill="#2B1D16" stroke="#E05D26" stroke-width="1.2" />
      <text x="0" y="4" class="mono" font-size="11" font-weight="600" fill="#FFA573">memory.md</text>
      <text x="80" y="5" class="sans" font-size="11" fill="#4ADE80">✓</text>
    </g>

    <!-- Floating Bubble: "闲时微梦 自动蒸馏" -->
    <g transform="translate(30, 280)">
      <rect x="0" y="0" width="170" height="42" rx="8" fill="#1C1B19" stroke="#3A3733" stroke-width="1" />
      <text x="12" y="18" class="sans" font-size="11" font-weight="600" fill="#FAF7F2">闲时微梦 · 自动蒸馏</text>
      <text x="12" y="32" class="mono" font-size="10" fill="#E05D26">3,000 char memory budget</text>
    </g>

    <!-- Floating Bubble: "跨源去重" -->
    <g transform="translate(230, 290)">
      <rect x="0" y="0" width="190" height="38" rx="8" fill="#1C1B19" stroke="#3A3733" stroke-width="1" />
      <text x="12" y="16" class="sans" font-size="11" font-weight="500" fill="#D6D0C5">会话结束，记忆继续</text>
      <text x="12" y="28" class="mono" font-size="9" fill="#8E9EAA">ZERO TELEMETRY • LOCAL VAULT</text>
    </g>
  </g>
</svg>
