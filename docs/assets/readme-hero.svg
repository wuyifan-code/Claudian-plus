<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <title>Claudian Plus - Local-First Cognitive Agent Workspace for Obsidian</title>
  <defs>
    <style>
      .serif { font-family: "Charter", "Georgia", "Cambria", "Songti SC", "Source Han Serif SC", serif; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans", sans-serif; }
      .mono { font-family: ui-monospace, "SF Mono", "Cascadia Code", "Fira Code", monospace; }
    </style>
  </defs>

  <!-- Canvas Surface: Warm Parchment with Hairline Border -->
  <rect x="0" y="0" width="1200" height="420" rx="16" fill="#FAF8F5" stroke="#E6DFD5" stroke-width="1.5" />

  <!-- Subtle Editorial Layout Lines -->
  <g stroke="#EFE9DE" stroke-width="1">
    <line x1="680" y1="36" x2="680" y2="384" />
    <line x1="64" y1="316" x2="630" y2="316" />
  </g>

  <!-- ================= LEFT COLUMN: EDITORIAL IDENTITY ================= -->

  <!-- Top Metadata Eyebrow -->
  <g transform="translate(64, 44)">
    <circle cx="5" cy="5" r="4" fill="#C85023" />
    <text x="18" y="9" class="mono" font-size="11" font-weight="600" fill="#7A746B" letter-spacing="1.6">OBSIDIAN / COGNITIVE AGENT WORKSPACE</text>
    <text x="440" y="9" class="mono" font-size="11" fill="#A8A298">RELEASE 3.0.1</text>
  </g>

  <!-- Main Title & Asterisk Symbol -->
  <g transform="translate(64, 114)">
    <!-- Crisp Asterisk Emblem -->
    <g transform="translate(0, -28)">
      <circle cx="18" cy="18" r="18" fill="#F0ECE1" stroke="#E2DBD0" stroke-width="1" />
      <path d="M 18 8 L 18 28 M 8 18 L 28 18 M 11 11 L 25 25 M 11 25 L 25 11" stroke="#C85023" stroke-width="2.2" stroke-linecap="round" />
    </g>
    <text x="48" y="0" class="sans" font-size="40" font-weight="700" fill="#1C1B19" letter-spacing="-0.8">Claudian Plus</text>
  </g>

  <!-- Value Statement (Editorial Typography) -->
  <g transform="translate(64, 168)">
    <text x="0" y="0" class="serif" font-size="24" font-weight="400" fill="#1C1B19" letter-spacing="-0.2">
      Your notes remember. Now your AI does too.
    </text>
    <text x="0" y="32" class="sans" font-size="15" font-weight="400" fill="#736D64" line-height="1.6">
      在 Obsidian，让 AI 记住你。本地优先多 Agent 协同与长程认知记忆引擎。
    </text>
  </g>

  <!-- Core Attribute Tags (Clean Hairline Borders, Zero Emoji) -->
  <g transform="translate(64, 252)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="156" height="30" rx="6" fill="#F4EFE6" stroke="#DED6C8" stroke-width="1" />
    <text x="12" y="19" class="mono" font-size="11" font-weight="600" fill="#9C3A16">DREAMING V3</text>
    <text x="96" y="19" class="sans" font-size="11" fill="#736D64">闲时微梦</text>

    <!-- Tag 2 -->
    <rect x="166" y="0" width="168" height="30" rx="6" fill="#F4EFE6" stroke="#DED6C8" stroke-width="1" />
    <text x="12" y="19" class="mono" font-size="11" font-weight="600" fill="#1C1B19">CODEX-FIRST</text>
    <text x="100" y="19" class="sans" font-size="11" fill="#736D64">多 Agent</text>

    <!-- Tag 3 -->
    <rect x="344" y="0" width="164" height="30" rx="6" fill="#F4EFE6" stroke="#DED6C8" stroke-width="1" />
    <text x="12" y="19" class="mono" font-size="11" font-weight="600" fill="#1C1B19">0 KB TELEMETRY</text>
    <text x="114" y="19" class="sans" font-size="11" fill="#736D64">本地安全</text>
  </g>

  <!-- Provider Support Footnote -->
  <g transform="translate(64, 350)">
    <text x="0" y="0" class="mono" font-size="11" font-weight="600" fill="#8C857B" letter-spacing="1">ORCHESTRATES:</text>
    <text x="110" y="0" class="mono" font-size="11" fill="#47433E">Codex (Default)  •  Claude Code  •  Kimi ACP  •  OpenCode  •  Pi</text>
  </g>

  <!-- ================= RIGHT COLUMN: RESTRAINED KNOWLEDGE TOPOLOGY ================= -->

  <g transform="translate(710, 44)">
    <!-- Container Card for Graph -->
    <rect x="0" y="0" width="426" height="332" rx="12" fill="#F4EFE6" stroke="#E2DBD0" stroke-width="1" />

    <!-- Top Label -->
    <g transform="translate(20, 24)">
      <text x="0" y="0" class="mono" font-size="10" font-weight="600" fill="#8C857B" letter-spacing="1.4">VAULT TOPOLOGY / MEMORY SYNTHESIS</text>
    </g>

    <!-- Constellation Graph (Calm Slate & Hairline Ink) -->
    <g stroke="#CDC5B7" stroke-width="1">
      <line x1="60" y1="80" x2="140" y2="60" />
      <line x1="140" y1="60" x2="230" y2="90" />
      <line x1="60" y1="80" x2="90" y2="150" />
      <line x1="90" y1="150" x2="190" y2="160" />
      <line x1="230" y1="90" x2="330" y2="70" />
      <line x1="330" y1="70" x2="370" y2="130" />
      <line x1="190" y1="160" x2="280" y2="160" />
      <line x1="280" y1="160" x2="370" y2="130" />
      <line x1="90" y1="150" x2="120" y2="220" />
      <line x1="120" y1="220" x2="210" y2="230" />
      <line x1="210" y1="230" x2="280" y2="160" />
    </g>

    <!-- Active Ink Connection Line -->
    <line x1="90" y1="150" x2="200" y2="130" stroke="#C85023" stroke-width="1.8" />
    <line x1="200" y1="130" x2="290" y2="180" stroke="#C85023" stroke-width="1.8" stroke-dasharray="3 3" />

    <!-- Graph Nodes -->
    <circle cx="60" cy="80" r="3.5" fill="#A8A298" />
    <circle cx="140" cy="60" r="4" fill="#A8A298" />
    <circle cx="330" cy="70" r="4" fill="#A8A298" />
    <circle cx="370" cy="130" r="3.5" fill="#A8A298" />
    <circle cx="120" cy="220" r="3.5" fill="#A8A298" />
    <circle cx="210" cy="230" r="4" fill="#A8A298" />

    <!-- Active Vault Node -->
    <g transform="translate(90, 150)">
      <circle cx="0" cy="0" r="10" fill="#FAF8F5" stroke="#C85023" stroke-width="2" />
      <circle cx="0" cy="0" r="3.5" fill="#C85023" />
      <text x="-46" y="-16" class="sans" font-size="11" font-weight="600" fill="#1C1B19">Note Context</text>
    </g>

    <!-- Dreaming Node -->
    <g transform="translate(200, 130)">
      <circle cx="0" cy="0" r="8" fill="#F0ECE1" stroke="#8C857B" stroke-width="1.5" />
      <circle cx="0" cy="0" r="3" fill="#8C857B" />
      <text x="14" y="-8" class="mono" font-size="10" font-weight="600" fill="#7A746B">Distill (30s)</text>
    </g>

    <!-- Memory Target Node: memory.md -->
    <g transform="translate(280, 170)">
      <rect x="0" y="0" width="116" height="32" rx="6" fill="#FAF8F5" stroke="#C85023" stroke-width="1.2" />
      <text x="12" y="20" class="mono" font-size="11" font-weight="600" fill="#C85023">memory.md</text>
    </g>

    <!-- Bottom Data Metrics Strip -->
    <g transform="translate(20, 276)">
      <line x1="0" y1="0" x2="386" y2="0" stroke="#E2DBD0" stroke-width="1" />
      <g transform="translate(0, 18)">
        <text x="0" y="0" class="mono" font-size="10" fill="#8C857B">IDLE OVERHEAD</text>
        <text x="0" y="16" class="mono" font-size="12" font-weight="600" fill="#1C1B19">&lt; 1.2% CPU</text>
      </g>
      <g transform="translate(130, 18)">
        <text x="0" y="0" class="mono" font-size="10" fill="#8C857B">MAX INJECTION</text>
        <text x="0" y="16" class="mono" font-size="12" font-weight="600" fill="#1C1B19">3,000 CHARS</text>
      </g>
      <g transform="translate(270, 18)">
        <text x="0" y="0" class="mono" font-size="10" fill="#8C857B">CLOUD TELEMETRY</text>
        <text x="0" y="16" class="mono" font-size="12" font-weight="600" fill="#1C1B19">0 KB</text>
      </g>
    </g>
  </g>
</svg>
