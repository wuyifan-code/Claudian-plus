<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%" role="img" aria-labelledby="cpPipeTitle cpPipeDesc">
  <title id="cpPipeTitle">Claudian Plus memory lifecycle</title>
  <desc id="cpPipeDesc">Four dependent stages: a turn ends and the gate opens after three exchanges; an auxiliary query distills the transcript under an 8,000 character input cap; new rules are staged for review rather than written silently; approved memory is injected into later prompts within a 1,500 character budget.</desc>
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans", sans-serif; }
      .mono { font-family: ui-monospace, "SF Mono", "Cascadia Code", "Fira Code", monospace; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="400" rx="16" fill="#FAF8F5" stroke="#E6DFD5" stroke-width="1.5" />

  <!-- Header -->
  <text x="64" y="56" class="mono" font-size="18" font-weight="600" fill="#C85023" letter-spacing="1.1">MEMORY LIFECYCLE</text>
  <text x="64" y="92" class="sans" font-size="28" font-weight="700" fill="#1C1B19" letter-spacing="-0.4">How a conversation becomes something you keep</text>
  <text x="1136" y="56" class="mono" font-size="18" font-weight="600" fill="#8C857B" text-anchor="end">DREAMING V3</text>

  <!-- Stage 01 -->
  <g transform="translate(64, 124)">
    <rect x="0" y="0" width="253" height="212" rx="10" fill="#F4EFE6" stroke="#E2DBD0" stroke-width="1" />
    <text x="20" y="32" class="mono" font-size="18" font-weight="600" fill="#C85023">01</text>
    <text x="20" y="64" class="sans" font-size="20" font-weight="700" fill="#1C1B19">A turn ends</text>
    <text x="20" y="94" class="sans" font-size="18" fill="#736D64">Work starts when an</text>
    <text x="20" y="118" class="sans" font-size="18" fill="#736D64">exchange completes.</text>
    <text x="20" y="142" class="sans" font-size="18" fill="#736D64">Not on a timer.</text>
    <rect x="20" y="158" width="213" height="34" rx="7" fill="#FAF8F5" stroke="#DED6C8" stroke-width="1" />
    <text x="34" y="181" class="mono" font-size="18" font-weight="600" fill="#9C3A16">MIN 3 EXCHANGES</text>
  </g>

  <!-- Arrow 1 -->
  <g stroke="#C85023" stroke-width="2" fill="none">
    <line x1="322" y1="230" x2="329" y2="230" />
    <polyline points="325,225 331,230 325,235" />
  </g>

  <!-- Stage 02 -->
  <g transform="translate(337, 124)">
    <rect x="0" y="0" width="253" height="212" rx="10" fill="#F4EFE6" stroke="#E2DBD0" stroke-width="1" />
    <text x="20" y="32" class="mono" font-size="18" font-weight="600" fill="#C85023">02</text>
    <text x="20" y="64" class="sans" font-size="20" font-weight="700" fill="#1C1B19">Reads the session</text>
    <text x="20" y="94" class="sans" font-size="18" fill="#736D64">An auxiliary query</text>
    <text x="20" y="118" class="sans" font-size="18" fill="#736D64">compresses the</text>
    <text x="20" y="142" class="sans" font-size="18" fill="#736D64">transcript into rules.</text>
    <rect x="20" y="158" width="213" height="34" rx="7" fill="#FAF8F5" stroke="#DED6C8" stroke-width="1" />
    <text x="34" y="181" class="mono" font-size="18" font-weight="600" fill="#1C1B19">8,000 CHAR CAP</text>
  </g>

  <!-- Arrow 2 -->
  <g stroke="#C85023" stroke-width="2" fill="none">
    <line x1="595" y1="230" x2="602" y2="230" />
    <polyline points="598,225 604,230 598,235" />
  </g>

  <!-- Stage 03 -->
  <g transform="translate(610, 124)">
    <rect x="0" y="0" width="253" height="212" rx="10" fill="#F4EFE6" stroke="#E2DBD0" stroke-width="1" />
    <text x="20" y="32" class="mono" font-size="18" font-weight="600" fill="#C85023">03</text>
    <text x="20" y="64" class="sans" font-size="20" font-weight="700" fill="#1C1B19">Asks before writing</text>
    <text x="20" y="94" class="sans" font-size="18" fill="#736D64">New preferences and</text>
    <text x="20" y="118" class="sans" font-size="18" fill="#736D64">decisions surface as a</text>
    <text x="20" y="142" class="sans" font-size="18" fill="#736D64">notice you can review.</text>
    <rect x="20" y="158" width="213" height="34" rx="7" fill="#FAF8F5" stroke="#DED6C8" stroke-width="1" />
    <text x="34" y="181" class="mono" font-size="18" font-weight="600" fill="#1C1B19">REVIEW FIRST</text>
  </g>

  <!-- Arrow 3 -->
  <g stroke="#C85023" stroke-width="2" fill="none">
    <line x1="868" y1="230" x2="875" y2="230" />
    <polyline points="871,225 877,230 871,235" />
  </g>

  <!-- Stage 04 -->
  <g transform="translate(883, 124)">
    <rect x="0" y="0" width="253" height="212" rx="10" fill="#F4EFE6" stroke="#E2DBD0" stroke-width="1" />
    <text x="20" y="32" class="mono" font-size="18" font-weight="600" fill="#C85023">04</text>
    <text x="20" y="64" class="sans" font-size="20" font-weight="700" fill="#1C1B19">Into later prompts</text>
    <text x="20" y="94" class="sans" font-size="18" fill="#736D64">Approved memory is</text>
    <text x="20" y="118" class="sans" font-size="18" fill="#736D64">injected into later</text>
    <text x="20" y="142" class="sans" font-size="18" fill="#736D64">prompts. Capped.</text>
    <rect x="20" y="158" width="213" height="34" rx="7" fill="#FAF8F5" stroke="#DED6C8" stroke-width="1" />
    <text x="34" y="181" class="mono" font-size="18" font-weight="600" fill="#1C1B19">1,500 CHARS</text>
  </g>
</svg>
