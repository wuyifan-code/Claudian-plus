<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%">
  <title>Claudian Plus Architecture - Multi-Agent &amp; Cognitive Memory Engine</title>
  <defs>
    <!-- Gradients -->
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181716" />
      <stop offset="50%" stop-color="#141312" />
      <stop offset="100%" stop-color="#0F0E0D" />
    </linearGradient>

    <linearGradient id="columnBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#23211E" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1A1918" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="highlightCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#32241D" />
      <stop offset="100%" stop-color="#221A15" />
    </linearGradient>

    <filter id="glowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; font-weight: 700; }
    .mono { font-family: ui-monospace, "SF Mono", Monaco, "Cascadia Code", "Fira Code", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Noto Sans", sans-serif; }
  </style>

  <!-- Canvas Outer Boundary -->
  <rect x="0" y="0" width="1200" height="520" rx="20" fill="url(#archBg)" stroke="#2C2A27" stroke-width="1.5" />

  <!-- Section Header -->
  <g transform="translate(60, 42)">
    <text x="0" y="0" class="mono" font-size="11" font-weight="600" fill="#E05D26" letter-spacing="1.5">04 / SYSTEM TOPOLOGY</text>
    <text x="0" y="26" class="title" font-size="24" fill="#FAF7F2">Claudian Plus Architecture</text>
    <text x="320" y="24" class="sans" font-size="14" fill="#9C9589">Vault-scoped context, background memory distillation, and unified provider dispatch.</text>
  </g>

  <!-- ================= COLUMN 1: OBSIDIAN LOCAL VAULT ================= -->
  <g transform="translate(60, 96)">
    <rect x="0" y="0" width="310" height="290" rx="14" fill="url(#columnBg)" stroke="#33302B" stroke-width="1.2" />
    
    <!-- Column Header -->
    <rect x="0" y="0" width="310" height="42" rx="14" fill="#2A2825" />
    <path d="M 0 30 L 0 42 L 310 42 L 310 30 Z" fill="#2A2825" />
    <circle cx="20" cy="21" r="5" fill="#A1B5C4" />
    <text x="34" y="25" class="title" font-size="13" fill="#FAF7F2">OBSIDIAN LOCAL VAULT</text>
    <text x="235" y="25" class="mono" font-size="10" fill="#8E9EAA">CONTEXT</text>

    <!-- Context Sources -->
    <g transform="translate(18, 58)">
      <!-- Item 1: Markdown Notes -->
      <rect x="0" y="0" width="274" height="44" rx="8" fill="#1C1B19" stroke="#2D2B28" stroke-width="1" />
      <text x="14" y="20" class="sans" font-size="12" font-weight="600" fill="#EAE5DC">Markdown Notes &amp; Folders</text>
      <text x="14" y="34" class="mono" font-size="10" fill="#9C9589">@note, @folder, drag-and-drop context</text>

      <!-- Item 2: Canvas Integration -->
      <rect x="0" y="54" width="274" height="44" rx="8" fill="#1C1B19" stroke="#2D2B28" stroke-width="1" />
      <text x="14" y="74" class="sans" font-size="12" font-weight="600" fill="#EAE5DC">Visual Canvas &amp; Neighbors</text>
      <text x="14" y="88" class="mono" font-size="10" fill="#9C9589">Resolved links graph, visual node queries</text>

      <!-- Item 3: Frontmatter & Properties -->
      <rect x="0" y="108" width="274" height="44" rx="8" fill="#1C1B19" stroke="#2D2B28" stroke-width="1" />
      <text x="14" y="128" class="sans" font-size="12" font-weight="600" fill="#EAE5DC">Properties &amp; Frontmatter</text>
      <text x="14" y="142" class="mono" font-size="10" fill="#9C9589">FROM queries without Dataview API lock</text>

      <!-- Item 4: Editor & Selection -->
      <rect x="0" y="162" width="274" height="44" rx="8" fill="#1C1B19" stroke="#2D2B28" stroke-width="1" />
      <text x="14" y="182" class="sans" font-size="12" font-weight="600" fill="#EAE5DC">Active Editor Selection</text>
      <text x="14" y="196" class="mono" font-size="10" fill="#9C9589">Quick Agent inline edit &amp; file actions</text>
    </g>
  </g>

  <!-- Connection arrows: Col 1 -> Col 2 -->
  <g stroke="#E05D26" stroke-width="2" fill="none">
    <path d="M 370 200 L 440 200" marker-end="url(#arrow)" />
    <circle cx="370" cy="200" r="3" fill="#E05D26" />
    <circle cx="440" cy="200" r="3" fill="#E05D26" />
  </g>

  <!-- ================= COLUMN 2: CLAUDIAN PLUS RUNTIME ================= -->
  <g transform="translate(445, 96)">
    <rect x="0" y="0" width="350" height="290" rx="14" fill="url(#columnBg)" stroke="#D9531E" stroke-width="1.5" />
    
    <!-- Column Header -->
    <rect x="0" y="0" width="350" height="42" rx="14" fill="#2E231C" />
    <path d="M 0 30 L 0 42 L 350 42 L 350 30 Z" fill="#2E231C" />
    <circle cx="20" cy="21" r="5" fill="#FF7A3D" />
    <text x="34" y="25" class="title" font-size="13" fill="#FFA573">CLAUDIAN PLUS CORE</text>
    <text x="250" y="25" class="mono" font-size="10" fill="#FF9A66">ORCHESTRATOR</text>

    <!-- Runtime Modules -->
    <g transform="translate(18, 58)">
      <!-- Dreaming V3 Card (Highlighted) -->
      <rect x="0" y="0" width="314" height="60" rx="8" fill="url(#highlightCard)" stroke="#E05D26" stroke-width="1.2" />
      <text x="14" y="22" class="sans" font-size="13" font-weight="700" fill="#FF9E73">🧠 Dreaming V3 Cognitive Engine</text>
      <text x="14" y="38" class="sans" font-size="11" fill="#E3DDD3">Idle micro-dream (30s quiet) → auto distillation</text>
      <text x="14" y="51" class="mono" font-size="10" fill="#4ADE80">✓ 3,000 char budget • Cross-source dedup</text>

      <!-- Unified Conversation Bus -->
      <rect x="0" y="70" width="314" height="44" rx="8" fill="#1C1B19" stroke="#2D2B28" stroke-width="1" />
      <text x="14" y="90" class="sans" font-size="12" font-weight="600" fill="#EAE5DC">Unified Conversation Bus</text>
      <text x="14" y="104" class="mono" font-size="10" fill="#9C9589">Search, fork, rewind, replay &amp; restore</text>

      <!-- Vault Boundary & Safe Diff -->
      <rect x="0" y="124" width="314" height="44" rx="8" fill="#1C1B19" stroke="#2D2B28" stroke-width="1" />
      <text x="14" y="144" class="sans" font-size="12" font-weight="600" fill="#EAE5DC">Safe Vault Guard &amp; Diffs</text>
      <text x="14" y="158" class="mono" font-size="10" fill="#9C9589">Scoped writes, structured diff preview, undo</text>

      <!-- Floating Outline -->
      <rect x="0" y="178" width="314" height="40" rx="8" fill="#1C1B19" stroke="#2D2B28" stroke-width="1" />
      <text x="14" y="196" class="sans" font-size="12" font-weight="600" fill="#EAE5DC">Floating Outline &amp; Reader</text>
      <text x="14" y="210" class="mono" font-size="10" fill="#9C9589">Collapses thinking/tool noise into focus</text>
    </g>
  </g>

  <!-- Connection arrows: Col 2 -> Col 3 -->
  <g stroke="#E05D26" stroke-width="2" fill="none">
    <path d="M 795 200 L 870 200" marker-end="url(#arrow)" />
    <circle cx="795" cy="200" r="3" fill="#E05D26" />
    <circle cx="870" cy="200" r="3" fill="#E05D26" />
  </g>

  <!-- ================= COLUMN 3: MULTI-AGENT PROVIDERS ================= -->
  <g transform="translate(875, 96)">
    <rect x="0" y="0" width="265" height="290" rx="14" fill="url(#columnBg)" stroke="#33302B" stroke-width="1.2" />
    
    <!-- Column Header -->
    <rect x="0" y="0" width="265" height="42" rx="14" fill="#2A2825" />
    <path d="M 0 30 L 0 42 L 265 42 L 265 30 Z" fill="#2A2825" />
    <circle cx="20" cy="21" r="5" fill="#FF8F5A" />
    <text x="34" y="25" class="title" font-size="13" fill="#FAF7F2">AGENT PROVIDERS</text>
    <text x="200" y="25" class="mono" font-size="10" fill="#8E9EAA">EXEC</text>

    <!-- Provider Badges -->
    <g transform="translate(16, 58)">
      <!-- Codex CLI (Default) -->
      <rect x="0" y="0" width="233" height="44" rx="8" fill="#261E19" stroke="#E05D26" stroke-width="1" />
      <text x="12" y="20" class="sans" font-size="12" font-weight="700" fill="#FFA573">Codex CLI (Default ✦)</text>
      <text x="12" y="34" class="mono" font-size="10" fill="#D6CEBE">gpt-5.6-sol priority • Native stream</text>

      <!-- Claude Code -->
      <rect x="0" y="54" width="233" height="44" rx="8" fill="#1C1B19" stroke="#2D2B28" stroke-width="1" />
      <text x="12" y="74" class="sans" font-size="12" font-weight="600" fill="#EAE5DC">Claude Code</text>
      <text x="12" y="88" class="mono" font-size="10" fill="#9C9589">Thinking folding • Session format</text>

      <!-- Kimi ACP -->
      <rect x="0" y="108" width="233" height="44" rx="8" fill="#1C1B19" stroke="#2D2B28" stroke-width="1" />
      <text x="12" y="128" class="sans" font-size="12" font-weight="600" fill="#EAE5DC">Kimi ACP</text>
      <text x="12" y="142" class="mono" font-size="10" fill="#9C9589">Standard ACP • Multimodal &amp; discovery</text>

      <!-- OpenCode & Pi -->
      <rect x="0" y="162" width="233" height="44" rx="8" fill="#1C1B19" stroke="#2D2B28" stroke-width="1" />
      <text x="12" y="182" class="sans" font-size="12" font-weight="600" fill="#EAE5DC">OpenCode &amp; Pi</text>
      <text x="12" y="196" class="mono" font-size="10" fill="#9C9589">Sidecar isolation • Zero-dep bridge</text>
    </g>
  </g>

  <!-- ================= BOTTOM FOUNDATION: LOCAL STORAGE & PRIVACY ================= -->
  <g transform="translate(60, 410)">
    <rect x="0" y="0" width="1080" height="74" rx="12" fill="#1A1918" stroke="#33302B" stroke-width="1" />
    
    <g transform="translate(24, 24)">
      <circle cx="12" cy="12" r="6" fill="#4ADE80" />
      <text x="28" y="16" class="title" font-size="14" fill="#FAF7F2">LOCAL-FIRST STORAGE FOUNDATION</text>
      <text x="320" y="16" class="mono" font-size="12" fill="#FFA573">.claudian-plus/memory.md</text>
      <text x="510" y="16" class="mono" font-size="12" fill="#D6CEBE">.claudian-plus/profile.md</text>
      <text x="700" y="16" class="mono" font-size="12" fill="#A1B5C4">.claudian-plus/sessions/</text>
      
      <g transform="translate(860, -6)">
        <rect x="0" y="0" width="170" height="32" rx="6" fill="#202A20" stroke="#2D5A2D" stroke-width="1" />
        <text x="12" y="20" class="mono" font-size="11" font-weight="600" fill="#4ADE80">0 KB TELEMETRY 🔒</text>
      </g>
    </g>

    <text x="52" y="58" class="sans" font-size="11" fill="#857E73">No cloud index, no third-party tracking. All memories and histories are saved directly in your personal Vault filesystem.</text>
  </g>
</svg>
