<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="100%" role="img" aria-labelledby="cpArchTitle cpArchDesc">
  <title id="cpArchTitle">Claudian Plus system boundaries</title>
  <desc id="cpArchDesc">Three layers with a single dependency direction: vault context flows into a provider-neutral core runtime, which dispatches to provider adaptors. Vault context covers note and folder references, canvas and link graph, and frontmatter properties. The core runtime holds Dreaming V3, the session bus, and the vault write guard. Providers covers Codex as the default, Claude Code, and the opt-in Kimi, OpenCode, Pi and Antigravity adaptors.</desc>
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans", sans-serif; }
      .mono { font-family: ui-monospace, "SF Mono", "Cascadia Code", "Fira Code", monospace; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="440" rx="16" fill="#FAF8F5" stroke="#E6DFD5" stroke-width="1.5" />

  <!-- Header -->
  <text x="64" y="56" class="mono" font-size="18" font-weight="600" fill="#C85023" letter-spacing="1.1">SYSTEM BOUNDARIES</text>
  <text x="64" y="92" class="sans" font-size="28" font-weight="700" fill="#1C1B19" letter-spacing="-0.4">Three layers, one dependency direction</text>
  <text x="1136" y="56" class="mono" font-size="18" font-weight="600" fill="#8C857B" text-anchor="end">AGENTS.md</text>

  <!-- Layer 01: Vault context -->
  <g transform="translate(64, 124)">
    <rect x="0" y="0" width="341" height="268" rx="10" fill="#F4EFE6" stroke="#E2DBD0" stroke-width="1" />
    <text x="20" y="32" class="mono" font-size="18" font-weight="600" fill="#C85023">01</text>
    <text x="20" y="64" class="sans" font-size="20" font-weight="700" fill="#1C1B19">Vault context</text>
    <line x1="20" y1="82" x2="321" y2="82" stroke="#E2DBD0" stroke-width="1" />

    <text x="20" y="112" class="mono" font-size="18" font-weight="600" fill="#1C1B19">@note · @folder</text>
    <text x="20" y="136" class="sans" font-size="18" fill="#736D64">Notes, folders, drag-and-drop</text>

    <text x="20" y="174" class="mono" font-size="18" font-weight="600" fill="#1C1B19">Canvas &amp; graph</text>
    <text x="20" y="198" class="sans" font-size="18" fill="#736D64">Neighbour suggestions from links</text>

    <text x="20" y="236" class="mono" font-size="18" font-weight="600" fill="#1C1B19">Properties</text>
    <text x="20" y="260" class="sans" font-size="18" fill="#736D64">Frontmatter queries, no plugins</text>
  </g>

  <!-- Dependency arrow 1 -->
  <g stroke="#C85023" stroke-width="2" fill="none">
    <line x1="410" y1="258" x2="421" y2="258" />
    <polyline points="417,252 424,258 417,264" />
  </g>

  <!-- Layer 02: Core runtime -->
  <g transform="translate(429, 124)">
    <rect x="0" y="0" width="341" height="268" rx="10" fill="#F4EFE6" stroke="#D9D0C3" stroke-width="1.4" />
    <text x="20" y="32" class="mono" font-size="18" font-weight="600" fill="#9C3A16">02</text>
    <text x="20" y="64" class="sans" font-size="20" font-weight="700" fill="#1C1B19">Core runtime</text>
    <line x1="20" y1="82" x2="321" y2="82" stroke="#E2DBD0" stroke-width="1" />

    <text x="20" y="112" class="mono" font-size="18" font-weight="700" fill="#9C3A16">Dreaming V3</text>
    <text x="20" y="136" class="sans" font-size="18" fill="#736D64">Transcripts distilled into memory</text>

    <text x="20" y="174" class="mono" font-size="18" font-weight="600" fill="#1C1B19">Session bus</text>
    <text x="20" y="198" class="sans" font-size="18" fill="#736D64">Search, restore, fork and rewind</text>

    <text x="20" y="236" class="mono" font-size="18" font-weight="600" fill="#1C1B19">Vault guard</text>
    <text x="20" y="260" class="sans" font-size="18" fill="#736D64">Diff preview and in-session undo</text>
  </g>

  <!-- Dependency arrow 2 -->
  <g stroke="#C85023" stroke-width="2" fill="none">
    <line x1="775" y1="258" x2="786" y2="258" />
    <polyline points="782,252 789,258 782,264" />
  </g>

  <!-- Layer 03: Providers -->
  <g transform="translate(794, 124)">
    <rect x="0" y="0" width="341" height="268" rx="10" fill="#F4EFE6" stroke="#E2DBD0" stroke-width="1" />
    <text x="20" y="32" class="mono" font-size="18" font-weight="600" fill="#C85023">03</text>
    <text x="20" y="64" class="sans" font-size="20" font-weight="700" fill="#1C1B19">Providers</text>
    <line x1="20" y1="82" x2="321" y2="82" stroke="#E2DBD0" stroke-width="1" />

    <text x="20" y="112" class="mono" font-size="18" font-weight="700" fill="#9C3A16">Codex</text>
    <text x="20" y="136" class="sans" font-size="18" fill="#736D64">Default provider, gpt-5.6-sol</text>

    <text x="20" y="174" class="mono" font-size="18" font-weight="600" fill="#1C1B19">Claude Code</text>
    <text x="20" y="198" class="sans" font-size="18" fill="#736D64">Thinking chains, session replay</text>

    <text x="20" y="236" class="mono" font-size="18" font-weight="600" fill="#1C1B19">Opt-in providers</text>
    <text x="20" y="260" class="sans" font-size="18" fill="#736D64">Kimi, OpenCode, Pi, Antigravity</text>
  </g>
</svg>
