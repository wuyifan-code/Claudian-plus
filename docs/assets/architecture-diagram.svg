<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="100%">
  <title>Claudian Plus Architecture - Multi-Agent &amp; Cognitive Memory Engine</title>
  <defs>
    <style>
      .serif { font-family: "Charter", "Georgia", "Cambria", "Songti SC", "Source Han Serif SC", serif; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans", sans-serif; }
      .mono { font-family: ui-monospace, "SF Mono", "Cascadia Code", "Fira Code", monospace; }
    </style>
  </defs>

  <!-- Canvas Surface: Warm Parchment -->
  <rect x="0" y="0" width="1200" height="440" rx="16" fill="#FAF8F5" stroke="#E6DFD5" stroke-width="1.5" />

  <!-- Top Title Bar -->
  <g transform="translate(60, 36)">
    <text x="0" y="0" class="mono" font-size="11" font-weight="600" fill="#C85023" letter-spacing="1.6">TOPOLOGY / SYSTEM SPECIFICATION</text>
    <text x="0" y="26" class="sans" font-size="22" font-weight="700" fill="#1C1B19" letter-spacing="-0.3">Claudian Plus Architecture</text>
    <text x="310" y="24" class="serif" font-size="14" fill="#736D64">Vault-scoped context, background memory distillation, and unified provider dispatch.</text>
  </g>

  <!-- ================= 3 MAIN COLUMNS ================= -->

  <!-- COLUMN 1: VAULT CONTEXT -->
  <g transform="translate(60, 84)">
    <rect x="0" y="0" width="320" height="250" rx="10" fill="#F4EFE6" stroke="#E2DBD0" stroke-width="1" />
    
    <!-- Header -->
    <g transform="translate(20, 24)">
      <text x="0" y="0" class="mono" font-size="11" font-weight="600" fill="#7A746B">01 / VAULT CONTEXT</text>
      <text x="0" y="18" class="sans" font-size="13" font-weight="700" fill="#1C1B19">Obsidian File System</text>
    </g>

    <!-- Context Blocks -->
    <g transform="translate(16, 56)">
      <!-- Item 1 -->
      <rect x="0" y="0" width="288" height="38" rx="6" fill="#FAF8F5" stroke="#E6DFD5" stroke-width="1" />
      <text x="12" y="16" class="mono" font-size="11" font-weight="600" fill="#1C1B19">@note / @folder</text>
      <text x="12" y="29" class="sans" font-size="10" fill="#8C857B">Markdown files &amp; folder drag-and-drop</text>

      <!-- Item 2 -->
      <rect x="0" y="46" width="288" height="38" rx="6" fill="#FAF8F5" stroke="#E6DFD5" stroke-width="1" />
      <text x="12" y="62" class="mono" font-size="11" font-weight="600" fill="#1C1B19">Canvas &amp; Graph</text>
      <text x="12" y="75" class="sans" font-size="10" fill="#8C857B">Link-graph neighbor recommendation</text>

      <!-- Item 3 -->
      <rect x="0" y="92" width="288" height="38" rx="6" fill="#FAF8F5" stroke="#E6DFD5" stroke-width="1" />
      <text x="12" y="108" class="mono" font-size="11" font-weight="600" fill="#1C1B19">Properties (Frontmatter)</text>
      <text x="12" y="121" class="sans" font-size="10" fill="#8C857B">FROM metadata queries without Dataview API</text>

      <!-- Item 4 -->
      <rect x="0" y="138" width="288" height="38" rx="6" fill="#FAF8F5" stroke="#E6DFD5" stroke-width="1" />
      <text x="12" y="154" class="mono" font-size="11" font-weight="600" fill="#1C1B19">Editor Selection</text>
      <text x="12" y="167" class="sans" font-size="10" fill="#8C857B">Focused prompt via quick agent input</text>
    </g>
  </g>

  <!-- Link 1 -> 2 -->
  <g stroke="#C85023" stroke-width="1.5" fill="none">
    <line x1="380" y1="209" x2="440" y2="209" />
    <circle cx="380" cy="209" r="3" fill="#C85023" />
    <circle cx="440" cy="209" r="3" fill="#C85023" />
  </g>

  <!-- COLUMN 2: CORE RUNTIME -->
  <g transform="translate(440, 84)">
    <rect x="0" y="0" width="370" height="250" rx="10" fill="#F4EFE6" stroke="#D9D0C3" stroke-width="1.2" />
    
    <!-- Header -->
    <g transform="translate(20, 24)">
      <text x="0" y="0" class="mono" font-size="11" font-weight="600" fill="#9C3A16">02 / CORE RUNTIME</text>
      <text x="0" y="18" class="sans" font-size="13" font-weight="700" fill="#1C1B19">Claudian Plus Orchestrator</text>
    </g>

    <!-- Runtime Blocks -->
    <g transform="translate(16, 56)">
      <!-- Item 1: Dreaming V3 (Highlighted) -->
      <rect x="0" y="0" width="338" height="52" rx="6" fill="#FAF8F5" stroke="#C85023" stroke-width="1.2" />
      <text x="12" y="18" class="mono" font-size="11" font-weight="700" fill="#9C3A16">Dreaming V3 Cognitive Engine</text>
      <text x="12" y="32" class="sans" font-size="11" fill="#47433E">Idle micro-dream (30s) -> auto distillation</text>
      <text x="12" y="44" class="mono" font-size="10" fill="#7A746B">3,000 char budget • Cross-source dedup</text>

      <!-- Item 2: Unified Bus -->
      <rect x="0" y="60" width="338" height="38" rx="6" fill="#FAF8F5" stroke="#E6DFD5" stroke-width="1" />
      <text x="12" y="76" class="mono" font-size="11" font-weight="600" fill="#1C1B19">Unified Conversation Bus</text>
      <text x="12" y="89" class="sans" font-size="10" fill="#8C857B">Session search, restore, fork &amp; rewind</text>

      <!-- Item 3: Guard & Diff -->
      <rect x="0" y="106" width="338" height="38" rx="6" fill="#FAF8F5" stroke="#E6DFD5" stroke-width="1" />
      <text x="12" y="122" class="mono" font-size="11" font-weight="600" fill="#1C1B19">Vault Boundary Guard &amp; Diffs</text>
      <text x="12" y="135" class="sans" font-size="10" fill="#8C857B">Structured diff review &amp; in-session undo</text>

      <!-- Item 4: Floating Outline -->
      <rect x="0" y="152" width="338" height="30" rx="6" fill="#FAF8F5" stroke="#E6DFD5" stroke-width="1" />
      <text x="12" y="168" class="mono" font-size="11" font-weight="600" fill="#1C1B19">Floating Outline</text>
      <text x="130" y="168" class="sans" font-size="10" fill="#8C857B">Collapses tool and thinking noise</text>
    </g>
  </g>

  <!-- Link 2 -> 3 -->
  <g stroke="#C85023" stroke-width="1.5" fill="none">
    <line x1="810" y1="209" x2="870" y2="209" />
    <circle cx="810" cy="209" r="3" fill="#C85023" />
    <circle cx="870" cy="209" r="3" fill="#C85023" />
  </g>

  <!-- COLUMN 3: AGENT PROVIDERS -->
  <g transform="translate(870, 84)">
    <rect x="0" y="0" width="270" height="250" rx="10" fill="#F4EFE6" stroke="#E2DBD0" stroke-width="1" />
    
    <!-- Header -->
    <g transform="translate(20, 24)">
      <text x="0" y="0" class="mono" font-size="11" font-weight="600" fill="#7A746B">03 / PROVIDERS</text>
      <text x="0" y="18" class="sans" font-size="13" font-weight="700" fill="#1C1B19">Execution Boundaries</text>
    </g>

    <!-- Provider Blocks -->
    <g transform="translate(16, 56)">
      <!-- Codex -->
      <rect x="0" y="0" width="238" height="38" rx="6" fill="#FAF8F5" stroke="#C85023" stroke-width="1" />
      <text x="12" y="16" class="mono" font-size="11" font-weight="700" fill="#9C3A16">Codex CLI (Default)</text>
      <text x="12" y="29" class="sans" font-size="10" fill="#8C857B">gpt-5.6-sol priority • Native streaming</text>

      <!-- Claude -->
      <rect x="0" y="46" width="238" height="38" rx="6" fill="#FAF8F5" stroke="#E6DFD5" stroke-width="1" />
      <text x="12" y="62" class="mono" font-size="11" font-weight="600" fill="#1C1B19">Claude Code</text>
      <text x="12" y="75" class="sans" font-size="10" fill="#8C857B">Thinking chain folding • Session replay</text>

      <!-- Kimi -->
      <rect x="0" y="92" width="238" height="38" rx="6" fill="#FAF8F5" stroke="#E6DFD5" stroke-width="1" />
      <text x="12" y="108" class="mono" font-size="11" font-weight="600" fill="#1C1B19">Kimi ACP Protocol</text>
      <text x="12" y="121" class="sans" font-size="10" fill="#8C857B">Model discovery &amp; per-tool approvals</text>

      <!-- OpenCode / Pi -->
      <rect x="0" y="138" width="238" height="38" rx="6" fill="#FAF8F5" stroke="#E6DFD5" stroke-width="1" />
      <text x="12" y="154" class="mono" font-size="11" font-weight="600" fill="#1C1B19">OpenCode &amp; Pi</text>
      <text x="12" y="167" class="sans" font-size="10" fill="#8C857B">Isolated sidecar • Node built-ins</text>
    </g>
  </g>

  <!-- ================= BOTTOM STRIP: LOCAL STORAGE & SECURITY ================= -->
  <g transform="translate(60, 350)">
    <rect x="0" y="0" width="1080" height="54" rx="8" fill="#F4EFE6" stroke="#E2DBD0" stroke-width="1" />
    
    <g transform="translate(20, 18)">
      <text x="0" y="14" class="mono" font-size="11" font-weight="600" fill="#7A746B">04 / PERSISTENCE</text>
      
      <text x="140" y="14" class="mono" font-size="11" fill="#C85023">.claudian-plus/memory.md</text>
      <text x="330" y="14" class="mono" font-size="11" fill="#47433E">.claudian-plus/profile.md</text>
      <text x="520" y="14" class="mono" font-size="11" fill="#47433E">.claudian-plus/sessions/</text>

      <g transform="translate(860, -4)">
        <rect x="0" y="0" width="180" height="26" rx="5" fill="#FAF8F5" stroke="#D9D0C3" stroke-width="1" />
        <text x="14" y="17" class="mono" font-size="10" font-weight="600" fill="#1C1B19">0 KB CLOUD TELEMETRY</text>
      </g>
    </g>
  </g>
</svg>
